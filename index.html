<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World of Forms Generator</title>
  <link rel="stylesheet" href="style.css">

  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background: var(--background);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      transition: background 0.5s, color 0.5s;
    }

    :root {
      --background: #ffffff;
      --text: #000000;
      --glass-bg: rgba(255, 255, 255, 0.25);
      --glass-border: rgba(255, 255, 255, 0.18);
      --accent: #ff3b30;
      --hover-bg: #f0f0f0;

      /* Slider colors */
      --slider-track-bg: #222;
      --slider-thumb-bg: #888;
      --slider-thumb-hover-bg: #aaa;
    }

    body.dark {
      --background: #121212;
      --text: #ffffff;
      --glass-bg: rgba(40, 40, 40, 0.35);
      --glass-border: rgba(255, 255, 255, 0.15);
      --accent: #ff453a;
      --hover-bg: #2a2a2a;

      --slider-track-bg: #ddd;
      --slider-thumb-bg: #bbb;
      --slider-thumb-hover-bg: #eee;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 95%;
      max-width: 900px;
      gap: 10px;
    }

    /* Flat, opaque look matching die-welt-der-formen.de - no glass/blur/shadow.
       The visible canvas frame is drawn by the sketch itself (see sketch.js draw()),
       not by CSS.
       Fixed 600px box (matching canvasW in sketch.js) instead of flex:1 -
       flex-growing this to fill leftover vertical space fought with
       aspect-ratio:1/1 and produced a non-square box that clipped/offset
       the actual <canvas> element. max-width:100% is the responsive
       fallback for narrow viewports. */
    #canvas-container {
      width: 600px;
      max-width: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--background);
      overflow: hidden;
    }

    /* p5.js sets width/height as inline style="" attributes on the canvas
       element itself, which override height:auto here directly (same
       property, inline always wins) - but max-width/max-height always cap
       the computed size regardless of where width/height came from, so
       those are what actually keep this square inside #canvas-container. */
    #canvas-container canvas {
      max-width: 100%;
      max-height: 100%;
    }

    .controls-container {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 15px;
      background: transparent;
      width: 100%;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0;
      width: auto; /* overrides legacy .control-group{width:100%} in style.css,
                       which was written for the old CSS-Grid layout */
    }

    /* Same specificity as .control-group{display:flex} above, so without
       this the native [hidden] UA rule (also display:none at that
       specificity) loses the cascade tie to it and never actually hides
       anything - this is what the layer offset/preset control-groups
       (contextually hidden while Base is the active tab) rely on. */
    .control-group[hidden] {
      display: none;
    }

    .control-group label {
      display: none;
    }

    input[type="range"], input[type="checkbox"] {
      border-radius: 8px;
      border: none;
      padding: 4px;
      background: var(--background);
      color: var(--text);
    }

    /* Minimalist slider styling */
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: var(--slider-track-bg);
      border-radius: 3px;
      outline: none;
      margin: 0;
      padding: 0;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      background: var(--slider-thumb-bg);
      cursor: pointer;
      border-radius: 50%;
      border: none;
      margin-top: -4px; /* center thumb */
      transition: background 0.3s;
    }
    input[type="range"]:hover::-webkit-slider-thumb {
      background: var(--slider-thumb-hover-bg);
    }
    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      background: var(--slider-thumb-bg);
      cursor: pointer;
      border-radius: 50%;
      border: none;
      transition: background 0.3s;
    }
    input[type="range"]:hover::-moz-range-thumb {
      background: var(--slider-thumb-hover-bg);
    }

    .button-group {
      display: flex;
      justify-content: center;
      gap: 5px;
    }

    /* Buttons (shapes & actions) - matches die-welt-der-formen.de:
       40x40, 4px radius, solid black border, flat white fill,
       active = inverted (black bg / white icon), hover = light gray. */
    .icon-btn {
      background: var(--background);
      border: 1px solid var(--text);
      border-radius: 4px;
      width: 40px;
      height: 40px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text);
      transition: background 0.2s ease;
    }

    .icon-btn:hover {
      background: var(--hover-bg);
    }

    .icon-btn svg {
      display: block;
    }

    .icon-btn.active {
      background: var(--text);
      color: var(--background);
    }

    /* Text-label buttons (active layer selector, mesh-width presets) -
       same visual language as .icon-btn (border/radius/hover/active-
       invert) but auto-width to fit a text label instead of a fixed
       40x40 icon square. */
    .layer-btn {
      background: var(--background);
      border: 1px solid var(--text);
      border-radius: 4px;
      height: 40px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      transition: background 0.2s ease;
    }

    .layer-btn:hover {
      background: var(--hover-bg);
    }

    .layer-btn.active {
      background: var(--text);
      color: var(--background);
    }

    .layer-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    /* Roadmap 1.10b-ii-b: cross-layer compute status line - live segment/
       time estimate before a compute, result summary or stale-result
       notice after one. Muted via opacity rather than a separate color
       token (none of this project's existing tokens cover "secondary
       text") so it still flips correctly with the light/dark --text
       variable. Roadmap 1.11-B: #pattern-name-status (the active
       sheet's computeThemeLineName() result, or a placeholder when
       empty) shares this exact style - same "small muted status text"
       role, just a different status line. */
    #cross-layer-status, #pattern-name-status {
      font-size: 12px;
      color: var(--text);
      opacity: 0.7;
      text-align: center;
      min-height: 14px;
    }

    /* One dynamically-created additional-layer tab: enable checkbox +
       label button + remove button, grouped tightly so the tab strip
       reads as one unit per layer (see renderLayerTabs() in sketch.js). */
    .layer-tab {
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .layer-remove-btn {
      width: 22px;
      height: 22px;
      padding: 0;
      border: 1px solid var(--text);
      border-radius: 4px;
      background: var(--background);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }

    .layer-remove-btn:hover {
      background: var(--hover-bg);
    }

    .icon-row {
      display: flex;
      justify-content: center;
      gap: 5px;
    }

    /* Small number inputs (Shape Size, Node Count) - matches die-welt-der-formen.de:
       60x40, 4px radius, solid black border, flat white fill. */
    .control-group input[type="number"] {
      font-size: 16px;
      color: var(--text);
      background: var(--background);
      border: 1px solid var(--text);
      border-radius: 4px;
      padding: 5px;
      width: 60px;
      height: 40px;
      box-sizing: border-box;
      margin: 0;
      text-align: center;
    }

    /* Generic modal dialog - shared by the Help overlay and the Export
       format dialog, same flat look as the rest of the UI. */
    .dialog-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .dialog-overlay.hidden {
      display: none;
    }

    .dialog-content {
      background: var(--background);
      color: var(--text);
      border: 1px solid var(--text);
      padding: 20px 24px;
      max-width: 320px;
    }

    .dialog-content ul {
      padding-left: 20px;
    }

    .dialog-content button {
      margin-top: 12px;
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      cursor: pointer;
    }

    .format-options {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .format-options .format-btn {
      flex: 1;
      margin-top: 0;
      padding: 10px;
      border: 1px solid var(--text);
      border-radius: 4px;
      background: var(--background);
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s ease;
    }

    .format-options .format-btn:hover {
      background: var(--hover-bg);
    }

    @media (max-width: 600px) {
      .controls-container {
        justify-content: space-between;
      }
    }
  </style>
</head>

<body>
  <div class="main-container">
    <!-- Canvas container -->
    <div id="canvas-container"></div>

    <!-- Controls container -->
    <div class="controls-container">
      <!-- Shape Icons -->
      <div class="control-group">
        <label>Shape</label>
        <div class="icon-row">
          <button class="shape-icon-btn icon-btn active" data-shape="triangle" title="Triangle">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 4L4 20h16L12 4z" />
            </svg>
          </button>
          <button class="shape-icon-btn icon-btn" data-shape="square" title="Square">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="4" y="4" width="16" height="16" />
            </svg>
          </button>
          <button class="shape-icon-btn icon-btn" data-shape="hex" title="Hexagon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2l8.66 5v10L12 22 3.34 17V7L12 2z" />
            </svg>
          </button>
        </div>
      </div>

      <div class="control-group">
        <label for="shape-size-input">Shape Size</label>
        <input type="number" id="shape-size-input" min="1" max="9" value="5">
      </div>

      <div class="control-group">
        <label for="node-count-input">Node Count</label>
        <input type="number" id="node-count-input" min="1" max="5" value="3">
      </div>

      <!-- Visibility Toggle, Curve Toggle & Free Endpoints Toggle -->
      <div class="control-group">
        <div class="icon-row">
          <button id="btn-toggle-nodes" class="icon-btn active" title="Toggle Nodes">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
          <button id="btn-toggle-curve" class="icon-btn" title="Toggle Curve">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 12c2-4 6-4 8 0s6 4 8 0" />
            </svg>
          </button>
          <!-- Roadmap 1.5-B: kind:'free' toggle, separate from (not a
               redesign of) the curve toggle above - three-way mutually
               exclusive with it and with face-fill (see sketch.js). -->
          <button id="btn-toggle-free" class="icon-btn" title="Toggle Free Clothing">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M2 17c1.5-3 2-5 3.5-3s1 5 3 3-.5-6 2-6 1 6 3 4 0-6 2-4 1 4 3 2" />
            </svg>
          </button>
          <!-- Roadmap 1.10a: face-fill toggle, contextual to whichever
               layer tab is active (see updateFaceToggleControl() in
               sketch.js) and mutually exclusive with the curve toggle
               above (straight-line-only face detection - see
               core/faces.js's computeCellFaces()). -->
          <button id="btn-toggle-faces" class="icon-btn" title="Toggle Face Fill">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none">
              <path d="M12 2 L22 20 L2 20 Z" />
            </svg>
          </button>
          <button id="btn-toggle-free-endpoints" class="icon-btn" title="Toggle Free Endpoints">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10" />
              <line x1="22" y1="12" x2="18" y2="12" />
              <line x1="6" y1="12" x2="2" y2="12" />
              <line x1="12" y1="6" x2="12" y2="2" />
              <line x1="12" y1="22" x2="12" y2="18" />
            </svg>
          </button>
          <!-- Roadmap 1.2-C: alternative net construction - one-shot
               tool-like toggle (not a persistent mode), see sketch.js's
               altNetActive/altNetPending state machine. Icon: a dashed
               polygon outline with one solid edge and its two endpoints
               marked, suggesting "click an edge, complete to a shape". -->
          <button id="btn-alternative-net" class="icon-btn" title="Alternative Net Construction (click two points, then a third to confirm the side)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="12,3 20,9 17,19 7,19 4,9" stroke-dasharray="3,2" />
              <line x1="7" y1="19" x2="17" y2="19" stroke-width="3" />
              <circle cx="7" cy="19" r="1.6" fill="currentColor" stroke="none" />
              <circle cx="17" cy="19" r="1.6" fill="currentColor" stroke="none" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Roadmap 1.5-B: kind:'free' controls - a plate-wide setting
           (curveType, not per-layer, same as fold/symmetric/leaning/
           strength already are - see core/curves.js's own docblock),
           so this sits next to the icon row that selects curve style,
           not near the layer-tab-contextual offset controls below.
           Hidden whenever curveType.kind !== 'free' - shown/hidden by
           sketch.js's updateFreeControls(), same [hidden]-attribute
           pattern the layer-offset groups already use. -->
      <div class="control-group" id="free-roughness-group" hidden>
        <label for="free-roughness-input">Roughness</label>
        <input type="number" id="free-roughness-input" min="0" max="5" step="0.25" value="1">
      </div>
      <div class="control-group" id="free-controls-group" hidden>
        <div class="icon-row">
          <!-- "heimliches Gesetz" ("hidden law") toggle - whether the
               plain theme-line stays visible alongside the free stroke
               or is hidden (curveType.visible). Same eye/eye-off icon-
               swap convention as #btn-toggle-nodes, a separate control
               for a separate thing (this hides the CONSTRUCTION line
               within kind:'free', not the node markers). -->
          <button id="btn-toggle-free-visible" class="icon-btn" title="Toggle Underlying Line (Hidden Law)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M1 1l22 22" />
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
            </svg>
          </button>
          <!-- Reroll, not a raw seed number input - see the 1.5-B design
               session for why (a seed has no meaningful order, unlike
               shape size/node count; "try another variation" is the
               actual mental model). Still fully deterministic/
               reproducible from that point on - only this button's own
               click uses Math.random(), never the render path itself
               (core/curves.js's buildCurvePieces() stays a pure
               function of the stored seed). -->
          <button id="btn-free-reroll-seed" class="icon-btn" title="Reroll Free Clothing Variation">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="3" />
              <circle cx="8" cy="8" r="1.4" fill="currentColor" stroke="none" />
              <circle cx="16" cy="8" r="1.4" fill="currentColor" stroke="none" />
              <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none" />
              <circle cx="8" cy="16" r="1.4" fill="currentColor" stroke="none" />
              <circle cx="16" cy="16" r="1.4" fill="currentColor" stroke="none" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Layer Tab Strip (Roadmap 1.9): Base (static, always present)
           + one tab per additional layer, rendered dynamically by
           sketch.js since the layer count is variable - see
           renderLayerTabs() in setup(). "+ Layer" adds a new one. -->
      <div class="control-group">
        <div class="icon-row">
          <button id="btn-layer-base" class="layer-btn active" title="Edit Base Sheet">Base</button>
          <span id="layer-tabs"></span>
          <button id="btn-add-layer" class="layer-btn" title="Add Layer">+ Layer</button>
        </div>
      </div>

      <!-- Roadmap 1.11-B: read-only theme-line orbit name for whichever
           sheet is currently active (Base or a layer tab) - contextual
           the same way the offset controls below are, since each sheet
           has its own connections[] and hence its own name. Compute-
           and-display only (1.11 design session's scope decision) - no
           browse/enumerate UI, and no cross-layer/combined name (1.9's
           offset overlay is a continuous parameter with no orbit
           structure - see core/orbits.js's own docblock). Updated by
           sketch.js's updatePatternNameStatus(), same "called once per
           draw(), cheap" pattern as #cross-layer-status. -->
      <div class="control-group" id="pattern-name-group">
        <label>Pattern Name</label>
        <span id="pattern-name-status"></span>
      </div>

      <!-- Offset Controls - contextual to whichever layer tab is
           active (one X/Y pair, not one per layer); hidden while Base
           is active, since the base sheet has no offset concept. -->
      <div class="control-group" id="layer-offset-x-group" hidden>
        <label for="layer-offset-x-input">Layer Shift X</label>
        <input type="number" id="layer-offset-x-input" value="0" step="1">
      </div>

      <div class="control-group" id="layer-offset-y-group" hidden>
        <label for="layer-offset-y-input">Layer Shift Y</label>
        <input type="number" id="layer-offset-y-input" value="0" step="1">
      </div>

      <div class="control-group" id="layer-mesh-preset-group" hidden>
        <div class="icon-row">
          <button id="btn-mesh-preset-x" class="layer-btn" title="Shift X by one mesh-width">1 mesh →</button>
          <button id="btn-mesh-preset-y" class="layer-btn" title="Shift Y by one mesh-width">1 mesh ↓</button>
        </div>
      </div>

      <!-- Cross-Layer Face Compute (Roadmap 1.10b-ii-b): applies to the
           base sheet + every ENABLED additional layer at once - not
           contextual to whichever tab is active, unlike the offset
           controls above, since it's inherently a cross-sheet operation.
           Synchronous compute (see the 1.10b-ii-b design session: post
           spatial-hash-fix real times are sub-second to a few seconds -
           see sketch.js's computeCrossLayerFacesFlow() for the deferred-
           via-setTimeout trick that lets the disabled/"Computing…" state
           actually paint before the synchronous freeze). No rendering
           yet - coloring + canvas display is 1.10b-ii-c; this step is
           compute + timing + staleness feedback only. -->
      <div class="control-group" id="cross-layer-compute-group">
        <button id="btn-compute-cross-layer" class="layer-btn" title="Compute Cross-Layer Faces">Compute Cross-Layer Faces</button>
        <span id="cross-layer-status"></span>
      </div>

      <!-- Action Buttons -->
      <div class="button-group">
        <button id="btn-clear" class="icon-btn" title="Clear">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" />
          </svg>
        </button>
        <button id="btn-undo" class="icon-btn" title="Undo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 14 4 9l5-5" />
            <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11" />
          </svg>
        </button>
        <button id="btn-redo" class="icon-btn" title="Redo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 14 20 9l-5-5" />
            <path d="M20 9h-10.5a5.5 5.5 0 0 0 -5.5 5.5v0a5.5 5.5 0 0 0 5.5 5.5H13" />
          </svg>
        </button>
        <button id="btn-random" class="icon-btn" title="Random Connection">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l-5 5M4 4l5 5" />
          </svg>
        </button>
        <button id="btn-save" class="icon-btn" title="Download Image">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3" />
          </svg>
        </button>
        <button id="btn-help" class="icon-btn" title="Help">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </button>
      </div>

      <!-- Hidden Canvas Size Input (fixed default, no live-resize control) -->
      <input type="range" id="canvas-size-slider" min="200" max="800" value="600" style="display:none;">
    </div>
  </div>

  <!-- Help Overlay -->
  <div id="help-overlay" class="dialog-overlay hidden">
    <div class="dialog-content">
      <p><strong>How to use:</strong></p>
      <ul>
        <li>Click nodes to connect them.</li>
        <li>Use the controls to change shape, size and node count.</li>
        <li>Toggle visibility of nodes and curvature.</li>
      </ul>
      <button id="close-help">Close</button>
    </div>
  </div>

  <!-- Export Overlay -->
  <div id="export-overlay" class="dialog-overlay hidden">
    <div class="dialog-content">
      <p><strong>Export as…</strong></p>
      <div class="format-options">
        <button id="export-png" class="format-btn" title="Export as PNG">PNG</button>
        <button id="export-json" class="format-btn" title="Export as JSON">JSON</button>
        <button id="export-svg" class="format-btn" title="Export as SVG">SVG</button>
      </div>
      <button id="close-export">Close</button>
    </div>
  </div>

  <script src="core/symmetry.js"></script>
  <script src="core/curves.js"></script>
  <script src="core/tiling.js"></script>
  <script src="core/faces.js"></script>
  <script src="core/orbits.js"></script>
  <script src="core/export.js"></script>
  <script src="sketch.js"></script>
